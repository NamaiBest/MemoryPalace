[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-moments"
version = "0.1.0"
description = "Offline stretch-gated EEG burst experiment with explicit synthetic provenance"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.2.6", "scipy==1.15.3", "scikit-learn==1.6.1",
  "pyriemann==0.8", "matplotlib==3.10.3", "joblib>=1.4,<2",
]

[project.optional-dependencies]
test = ["pytest==8.3.5"]
real = ["mne==1.10.1"]
topology = ["dionysus==2.2.3"]

[project.scripts]
eeg-moments = "eeg_moments.cli:main"

[tool.setuptools.packages.find]
include = ["eeg_moments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
