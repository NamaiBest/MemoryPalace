  </g>

  <g filter="url(#b1)" opacity="0.5" fill="#101a24">
    <rect x="60" y="430" width="150" height="470"/>
    <rect x="250" y="350" width="105" height="550"/>
    <rect x="390" y="490" width="170" height="410"/>
    <rect x="600" y="300" width="120" height="600"/>
