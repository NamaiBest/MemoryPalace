    <circle cx="512" cy="676" r="4"/><circle cx="548" cy="742" r="3"/>
    <circle cx="884" cy="640" r="4.5"/><circle cx="920" cy="716" r="3.5"/>
    <circle cx="1272" cy="700" r="4"/><circle cx="1320" cy="762" r="3"/>
