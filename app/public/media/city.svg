    <rect x="980" y="370" width="115" height="530"/>
    <rect x="1130" y="500" width="200" height="400"/>
    <rect x="1370" y="410" width="150" height="490"/>
  </g>

  <g filter="url(#b3)" opacity="0.32" fill="#0a1118">
