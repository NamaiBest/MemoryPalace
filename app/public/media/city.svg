<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#101f33"/>
      <stop offset="0.42" stop-color="#22374b"/>
      <stop offset="0.72" stop-color="#4a4a4e"/>
      <stop offset="1" stop-color="#140f0e"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.68" cy="0.62" r="0.42">
      <stop offset="0" stop-color="#ffc98a" stop-opacity="0.85"/>
      <stop offset="0.35" stop-color="#e88f52" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#e88f52" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool" cx="0.12" cy="0.18" r="0.45">
      <stop offset="0" stop-color="#5d8fc4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5d8fc4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig2" cx="0.5" cy="0.5" r="0.76">
      <stop offset="0.42" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.82"/>
    </radialGradient>
    <filter id="b1" x="-30%" y="-30%" width="160%" height="160%">
